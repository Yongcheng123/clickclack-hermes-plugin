[project]
name = "clickclack-hermes-plugin"
version = "0.1.0"
description = "ClickClack messaging platform plugin for Hermes Agent"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

